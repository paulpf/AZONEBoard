; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp12e-usb

[env:esp12e-usb]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_flags =
  -I src/config
  -I src/infrastructure
  -I src/domain
  -I src/contracts
  -I ../_secrets
  -I ../_config
lib_deps =
	adafruit/Adafruit SGP30 Sensor@^2.0.3
	wemos/WEMOS SHT3x@^1.0.0
	claws/BH1750@^1.3.0
	ESP8266WiFi
	knolleary/PubSubClient@^2.8
	ESP8266WebServer

[env:esp12e-ota]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_protocol = espota
; No fixed IP here on purpose - pass the target device IP via CLI
; (--upload-port) or use scripts/upload_ota.ps1, which prompts for it
; and remembers the last one used.
upload_port = 0.0.0.0
build_flags =
  -I src/config
  -I src/infrastructure
  -I src/domain
  -I src/contracts
  -I ../_secrets
  -I ../_config
lib_deps =
	adafruit/Adafruit SGP30 Sensor@^2.0.3
	wemos/WEMOS SHT3x@^1.0.0
	claws/BH1750@^1.3.0
	ESP8266WiFi
	knolleary/PubSubClient@^2.8
	ESP8266WebServer
